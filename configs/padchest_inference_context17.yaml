version: "1"
seed: 17
dataset:
  name: padchest
  root: gs://external-cxr-dataset/padchest/unpacked/images-224
  input_res: 128
  pad: 0
causal_schema:
  version: "1"
  variables: [age_at_study, sex, pediatric, tb_status, projection, view_position, study_year]
  edges: [[age_at_study, tb_status], [sex, tb_status], [pediatric, tb_status]]
model:
  name: hierarchical_vae
  context_dim: 17
optimizer:
  lr: 0.0001
  weight_decay: 0.01
  batch_size: 1
runtime:
  accelerator: cpu
  precision: fp32
artifacts:
  root: checkpoints
  run_name: padchest_context17_samples
workflow:
  type: infer
  checkpoint: gs://external-cxr-dataset/padchest/checkpoints_context17/padchest/image_model_padchest_tpu_v6e1_context17
  # Continuous values use the training [-1, 1] normalization. Categories are indices.
  parents:
    age_at_study: 0.0
    sex: 1
    pediatric: 0
    tb_status: 1
    projection: 0
    view_position: 0
    study_year: 0.2
  num_samples: 4
  latent_temperature: 1.0
  output_dir: samples/padchest
  trust_incomplete_checkpoint: true
