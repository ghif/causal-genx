version: "1"
seed: 7
dataset:
  name: padchest
  root: gs://external-cxr-dataset/padchest/unpacked/images-224
  metadata: gs://external-cxr-dataset/padchest/metadata/PADCHEST_chest_x_ray_images_labels_160K_01.02.19.csv
  image_prefix: gs://external-cxr-dataset/padchest/unpacked/images-224/images-224
  input_res: 128
  pad: 0
  context_norm: "[-1,1]"
  tb_label_mode: tb_or_sequelae
causal_schema:
  version: "1"
  variables: [age_at_study, sex, pediatric, tb_status, projection, view_position, study_year]
  edges: [[age_at_study, tb_status], [sex, tb_status], [pediatric, tb_status]]
model:
  name: hierarchical_vae
  context_dim: 22
  cond_prior: true
optimizer:
  lr: 0.0001
  weight_decay: 0.01
  batch_size: 32
runtime:
  accelerator: tpu
  precision: bf16
  expected_local_device_count: 1
  expected_global_device_count: 1
artifacts:
  root: checkpoints
  run_name: counterfactual_padchest_tpu_v6e1
  remote_root: gs://external-cxr-dataset/padchest/checkpoints
workflow:
  type: finetune-counterfactual
  scm_checkpoint: checkpoints/padchest/scm_padchest_tpu_v6e1/checkpoints/best
  predictor_checkpoint: checkpoints/padchest/predictor_padchest_tpu_v6e1/checkpoints/best
  image_model_checkpoint: checkpoints/padchest/image_model_padchest_tpu_v6e1/checkpoints/best
  epochs: 100
  speed_log_freq: 10
  checkpoint_freq: 5
  alpha: 0.1
  lmbda_init: 0.0
  lr_lagrange: 0.01
  damping: 100.0
  cf_particles: 1
  elbo_constraint: 1.84
  model_validation_batches: 1
  benchmark_steps: 0
