version: "1"
seed: 7
dataset:
  name: cxr_rait
  root: gs://cxr-rait/cxr-demography-data
  input_res: 128
  pad: 0
  context_norm: "[-1,1]"
causal_schema:
  version: "1"
  variables: [age, gender, tb_status]
  edges: [[age, tb_status]]
model:
  name: hierarchical_vae
  context_dim: 5
  cond_prior: true
optimizer:
  lr: 0.0001
  weight_decay: 0.01
  batch_size: 16
runtime:
  accelerator: cpu
  precision: fp32
artifacts:
  root: checkpoints
  run_name: counterfactual_cxr_rait
  remote_root: gs://cxr-rait/checkpoints
workflow:
  type: finetune-counterfactual
  scm_checkpoint: checkpoints/cxr_rait/scm_cxr_rait/checkpoints/best
  predictor_checkpoint: checkpoints/cxr_rait/predictor_cxr_rait/checkpoints/best
  image_model_checkpoint: checkpoints/cxr_rait/image_model_cxr_rait/checkpoints/best
  epochs: 500
  speed_log_freq: 50
  checkpoint_freq: 10
  alpha: 0.1
  lmbda_init: 0.0
  lr_lagrange: 0.01
  damping: 100.0
  cf_particles: 1
  elbo_constraint: 1.84
