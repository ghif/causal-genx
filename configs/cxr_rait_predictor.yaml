version: "1"
seed: 7
dataset:
  name: cxr_rait
  root: gs://cxr-rait/cxr-demography-data
  input_res: 128
  pad: 0
  context_norm: "[-1,1]"
causal_schema:
  version: "1"
  variables: [age, gender, tb_status]
  edges: [[age, tb_status]]
model:
  name: hierarchical_vae
  context_dim: 5
optimizer:
  lr: 0.0001
  weight_decay: 0.1
  batch_size: 16
runtime:
  accelerator: cpu
  precision: fp32
artifacts:
  root: checkpoints
  # run_name: predictor_torchxray-frozen_jax-cpu_31-07-2026
  run_name: predictor_torchxray-unfrozen_jax-cpu_01-08-2026
  remote_root: gs://cxr-rait/checkpoints
workflow:
  type: finetune-predictor
  predictor_model: cxr_rait_image_parent_predictor
  epochs: 100
  speed_log_freq: 50
  execution_mode: auto
  drop_remainder: true
  checkpoint_freq: 1
  # Produced by: python scripts/convert_cxr_weights.py
  pretrained_weights_path: gs://cxr-rait/checkpoints/pretrained/torchxrayvision_densenet121_flax.npz
  # freeze_backbone: true
  freeze_backbone: false
