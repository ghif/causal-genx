version: "2"
seed: 7
dataset:
  name: padchest
  root: gs://external-cxr-dataset/padchest/unpacked/images-224
  metadata: gs://external-cxr-dataset/padchest/metadata/PADCHEST_chest_x_ray_images_labels_160K_01.02.19.csv
  image_prefix: gs://external-cxr-dataset/padchest/unpacked/images-224/images-224
  input_res: 128
  pad: 0
  context_norm: "[-1,1]"
  tb_label_mode: tb_or_sequelae
causal_schema:
  version: "2"
  variables:
    - name: age_group
      kind: categorical
      encoded_dim: 5
      categories: ["0-4", "5-17", "18-39", "40-64", "65+"]
      source: derived_age_group
    - name: sex
      kind: categorical
      encoded_dim: 2
      categories: [non_m_or_unknown, M]
      source: PatientSex_DICOM
    - name: tb_status
      kind: binary
      source: Labels
    - name: projection
      kind: categorical
      encoded_dim: 5
      categories: [PA, AP, AP_horizontal, L, COSTAL]
      source: Projection
    - name: view_position
      kind: categorical
      encoded_dim: 6
      categories: [POSTEROANTERIOR, ANTEROPOSTERIOR, LATERAL, AP, PA, OTHER]
      source: ViewPosition_DICOM
    - name: scanner
      kind: categorical
      encoded_dim: 2
      categories: [ImagingDynamicsCompanyLtd, PhilipsMedicalSystems]
      source: Manufacturer_DICOM
  edges: [[age_group, tb_status], [sex, tb_status]]
model:
  name: padchest_scm
  context_dim: 21
optimizer:
  lr: 0.0001
  weight_decay: 0.1
  batch_size: 64
runtime:
  accelerator: tpu
  precision: fp32
  expected_local_device_count: 1
  expected_global_device_count: 1
  expected_process_count: 1
artifacts:
  root: checkpoints
  run_name: scm_padchest_v2_tpu_v6e1
  remote_root: gs://external-cxr-dataset/padchest/checkpoints_v2
workflow:
  type: train-scm
  scm_model: padchest_v2_scm
  epochs: 100
  speed_log_freq: 10
  checkpoint_freq: 1
  plot_samples: 1000
  widths: [64, 64]
  benchmark_steps: 0
