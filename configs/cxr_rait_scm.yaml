version: "1"
seed: 7
dataset:
  name: cxr_rait
  root: gs://cxr-rait/cxr-demography-data
  input_res: 128
  pad: 0
  context_norm: "[-1,1]"
causal_schema:
  version: "1"
  variables: [age, sex, tb_status]
  edges: [[age, tb_status]]
model:
  name: hierarchical_vae
  context_dim: 5
optimizer:
  lr: 0.0001
  weight_decay: 0.1
  batch_size: 16
runtime:
  accelerator: cpu
  precision: fp32
artifacts:
  root: checkpoints
  run_name: scm_jax-cpu_27-07-2026
  remote_root: ""
workflow:
  type: train-scm
  scm_model: cxr_rait_scm
  strict_artifact_contract: true
  epochs: 1000
  speed_log_freq: 50
  checkpoint_freq: 1
  plot_samples: 10000
  widths: [32, 32]
  benchmark_steps: 0
