version: "1"
seed: 7
dataset:
  name: cxr_rait
  root: gs://cxr-rait/cxr-demography-data
  input_res: 128
  pad: 0
  context_norm: "[-1,1]"
causal_schema:
  version: "1"
  variables: [age, gender, tb_status]
  edges: [[age, tb_status]]
model:
  name: hierarchical_vae
  context_dim: 5
  cond_prior: true
optimizer:
  lr: 0.0005
  weight_decay: 0.01
  batch_size: 16
runtime:
  accelerator: cpu
  precision: fp32
artifacts:
  root: checkpoints
  run_name: image_model_cxr_rait
  remote_root: gs://cxr-rait/checkpoints
workflow:
  type: train-image-model
  epochs: 1000
  speed_log_freq: 50
  viz_batch_size: 16
  checkpoint_freq: 10
  benchmark_steps: 0
  benchmark_warmup_steps: 20
