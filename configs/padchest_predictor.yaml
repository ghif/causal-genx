version: "1"
seed: 7
dataset:
  name: padchest
  root: gs://external-cxr-dataset/padchest/unpacked
  metadata: gs://external-cxr-dataset/padchest/PADCHEST_chest_x_ray_images_labels_160K_01.02.19.csv
  image_prefix: gs://external-cxr-dataset/padchest/unpacked/images-224/images-224
  input_res: 224
  pad: 0
  context_norm: "[-1,1]"
  tb_label_mode: tb_or_sequelae
  excluded_sources:
    - source: gs://external-cxr-dataset/padchest/unpacked/images-224/images-224/216840111366964012558082906712009300162151055_00-078-079.png
      reason: confirmed absent source object; gcloud storage ls matches no objects
causal_schema:
  version: "1"
  variables: [age_at_study, sex, pediatric, tb_status, projection, view_position, study_year]
  edges: [[age_at_study, tb_status], [sex, tb_status], [pediatric, tb_status]]
model:
  name: hierarchical_vae
  context_dim: 17
optimizer:
  lr: 0.0001
  weight_decay: 0.1
  batch_size: 16
runtime:
  accelerator: cpu
  precision: fp32
artifacts:
  root: checkpoints
  run_name: padchest_predictor
  remote_root: ""
workflow:
  type: train-predictor
  predictor_model: padchest_image_parent_predictor
  epochs: 100
  speed_log_freq: 50
  execution_mode: single_device
  drop_remainder: true
  checkpoint_freq: 1
  input_cache: "off"
  input_prefetch_workers: 8
  input_prefetch_batches: 2
  input_stage_mode: require
  input_stage_dir: checkpoints/padchest/stage
  input_stage_manifest: checkpoints/padchest/stage/manifest.jsonl
  input_stage_max_items: 200000
  input_stage_max_bytes: 50000000000
  input_stage_size_sample_items: 256
  input_stage_workers: 16
