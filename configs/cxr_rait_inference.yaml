version: "1"
seed: 7
dataset:
  name: cxr_rait
  root: gs://cxr-rait/cxr-demography-data
  input_res: 128
  pad: 0
  context_norm: "[-1,1]"
causal_schema:
  version: "1"
  variables: [age, gender, tb_status]
  edges: [[age, tb_status]]
model:
  name: hierarchical_vae
  context_dim: 5
optimizer:
  lr: 0.0001
  weight_decay: 0.01
  batch_size: 1
runtime:
  accelerator: cpu
  precision: fp32
artifacts:
  root: checkpoints
  run_name: inference_cxr_rait
  remote_root: gs://cxr-rait/checkpoints
workflow:
  type: infer
  checkpoint: checkpoints/cxr_rait/counterfactual_cxr_rait/checkpoints/best
  parents:
    age: 0.5
    gender: 1.0
    tb_status: 1.0
  beta: 1.0
